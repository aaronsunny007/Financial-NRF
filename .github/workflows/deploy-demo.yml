name: deploy-demo

# Builds the results-explorer image and pushes it to GitHub Container Registry
# (free), then optionally rolls the Azure Container App to the new image.
on:
  push:
    branches: [master]
    paths:
      - "deploy/**"
      - "results/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # for Azure OIDC login (only used if AZURE_DEPLOY is enabled)

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/financial-nrf-demo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "IMAGE_LC=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_LC }}:latest
            ${{ env.IMAGE_LC }}:${{ github.sha }}

  azure:
    # Runs only after you finish the one-time Azure setup in deploy/AZURE.md and
    # set the repository variable AZURE_DEPLOY=true.
    needs: build
    if: ${{ vars.AZURE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll the Container App to the new image
        run: |
          IMAGE_LC="${IMAGE,,}"
          az containerapp update \
            --name "${{ vars.AZURE_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${IMAGE_LC}:${{ github.sha }}"
