name: cpu-rerun

# Re-runs Experiments 1-5 with the corrected evidence-support scorer on free
# GitHub-hosted CPU runners, with no GPU and no paid API.
#
# The slow part is generation, so it is split across shards: each shard runs the
# five experiment scripts over its own slice of the items (NRF_SHARD) and records
# every generation in a cache file (NRF_GEN_CACHE). The replay job then merges the
# caches and runs the unchanged experiment scripts with --engine replay, which
# loads no model and fails on any prompt the shards did not cover. Outputs go to
# results/cpu_fp32/ on a new branch, so the recorded 4-bit GPU results are never
# overwritten.
#
# The generator is the same Qwen2.5-3B-Instruct, but in full precision on CPU
# rather than 4-bit NF4 on a GPU, so individual answers can differ from the
# recorded runs. Treat it as a replication, not a regeneration.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: Number of parallel shards
        default: '20'
      n_main:
        description: Items per experiment (Exp 1, 3, 4, 5)
        default: '50'
      n_exp2:
        description: Items per condition for Experiment 2
        default: '10'
      dtype:
        description: CPU precision for the generator (float32 or bfloat16)
        default: 'float32'

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 -c "import json,os; print('shards=' + json.dumps(list(range(int(os.environ['SHARDS'])))))" >> "$GITHUB_OUTPUT"

  generate:
    name: generate (shard ${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      NRF_SHARD: ${{ matrix.shard }}/${{ inputs.shards }}
      NRF_GEN_CACHE: ${{ github.workspace }}/gen/shard_${{ matrix.shard }}.jsonl
      NRF_CPU_DTYPE: ${{ inputs.dtype }}
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate sentence-transformers faiss-cpu numpy pandas

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen25-3b-minilm-v1

      - name: Fetch FinQA dev split
        run: curl -sSf -o data_loader/dev.json https://raw.githubusercontent.com/czyssrs/FinQA/main/dataset/dev.json

      - name: Machine
        run: |
          nproc; free -g | head -2; df -h . | tail -1; lscpu | grep -E "Model name|Flags" | cut -c1-200

      - name: Generate (all five experiments, this shard's items)
        env:
          N_MAIN: ${{ inputs.n_main }}
          N_EXP2: ${{ inputs.n_exp2 }}
          SHARD: ${{ matrix.shard }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p gen scratch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Logs and artifacts cannot be read while a job runs, so the shard pushes
          # its cache and the tail of its log to its own branch every few minutes.
          # That doubles as a checkpoint if the job is ever cut off.
          push_state() {
            tail -n 300 gen/log.txt > gen/log_tail.txt 2>/dev/null || true
            # one path at a time: git add aborts the whole command if any path is missing
            for f in gen/shard_${SHARD}.jsonl gen/log_tail.txt; do
              [ -e "$f" ] && git add -f "$f"
            done
            git commit -qm "shard ${SHARD} progress" 2>/dev/null || true
            git push -qf origin HEAD:refs/heads/cpu-gen-${RUN_ID}-${SHARD} 2>/dev/null || true
          }

          { echo "shard ${SHARD}"; nproc; free -g | head -2; lscpu | grep -E "Model name|Flags" | cut -c1-400; } > gen/log.txt 2>&1
          (
            # A shard with no items for an experiment (Experiment 2 has only a few)
            # fails its own summary step; its generations are cached before that.
            run() { echo "::group::$*"; echo "=== $(date -u +%T) START $*"; /usr/bin/time -v "$@" || true; echo "=== $(date -u +%T) END"; echo "::endgroup::"; }
            run python -m experiments.experiment1 --split dev --n "$N_MAIN" --ness-mode derived --output scratch/e1.csv
            run python -m experiments.experiment5 --split dev --n "$N_MAIN" --output scratch/e5.csv
            run python -m experiments.experiment4 --split dev --n "$N_MAIN" --injection-mode evidence --output scratch/e4.csv
            run python -m experiments.experiment2 --split dev --n "$N_EXP2" --output scratch/e2.csv
            run python -m experiments.experiment3 --split dev --n "$N_MAIN" --output scratch/e3.csv
          ) >> gen/log.txt 2>&1 &
          pid=$!
          while kill -0 $pid 2>/dev/null; do sleep 150; push_state; done
          push_state
          wc -l gen/*.jsonl || true
          tail -n 40 gen/log.txt

      - name: Upload generation cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gencache-${{ matrix.shard }}
          path: gen/*.jsonl
          if-no-files-found: warn

  replay:
    needs: generate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate sentence-transformers faiss-cpu numpy pandas

      - name: Fetch FinQA dev split
        run: curl -sSf -o data_loader/dev.json https://raw.githubusercontent.com/czyssrs/FinQA/main/dataset/dev.json

      - name: Collect shard caches from their branches
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git fetch -q origin "+refs/heads/cpu-gen-${RUN_ID}-*:refs/remotes/gen/*"
          mkdir -p caches
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/gen); do
            k=${ref##*-}
            git show "$ref:gen/shard_${k}.jsonl" > "caches/shard_${k}.jsonl" || echo "no cache on $ref"
          done
          ls -la caches

      - name: Merge caches
        run: |
          mkdir -p results/cpu_fp32
          cat caches/*.jsonl > results/cpu_fp32/generations_raw.jsonl
          python - <<'PY'
          import json
          seen, meta, n_in = {}, {}, 0
          for line in open("results/cpu_fp32/generations_raw.jsonl", encoding="utf-8"):
              line = line.strip()
              if not line:
                  continue
              rec = json.loads(line)
              if "_meta" in rec:
                  meta.update(rec["_meta"])
              else:
                  n_in += 1
                  seen[rec["key"]] = rec
          with open("results/cpu_fp32/generations.jsonl", "w", encoding="utf-8") as f:
              f.write(json.dumps({"_meta": meta}) + "\n")
              for rec in seen.values():
                  f.write(json.dumps(rec, ensure_ascii=False) + "\n")
          print(f"{n_in} entries in, {len(seen)} unique, meta={meta}")
          PY
          rm results/cpu_fp32/generations_raw.jsonl

      - name: Replay the five experiments
        env:
          NRF_GEN_CACHE_READ: ${{ github.workspace }}/results/cpu_fp32/generations.jsonl
          N_MAIN: ${{ inputs.n_main }}
          N_EXP2: ${{ inputs.n_exp2 }}
        run: |
          set -o pipefail
          O=results/cpu_fp32
          python -m experiments.experiment1 --engine replay --split dev --n "$N_MAIN" --ness-mode derived --output $O/experiment1_results_dev.csv | tee $O/log_experiment1.txt
          python -m experiments.experiment2 --engine replay --split dev --n "$N_EXP2" --output $O/experiment2_results_dev.csv | tee $O/log_experiment2.txt
          python -m experiments.experiment3 --engine replay --split dev --n "$N_MAIN" --output $O/experiment3_results_dev.csv | tee $O/log_experiment3.txt
          python -m experiments.experiment4 --engine replay --split dev --n "$N_MAIN" --injection-mode evidence --output $O/experiment4_results_dev.csv | tee $O/log_experiment4.txt
          python -m experiments.experiment5 --engine replay --split dev --n "$N_MAIN" --output $O/experiment5_results_dev.csv | tee $O/log_experiment5.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-fp32-results
          path: results/cpu_fp32

      - name: Commit results to a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "cpu-rerun-results-${{ github.run_id }}"
          git add -f results/cpu_fp32
          git commit -m "CPU re-run of Experiments 1-5 with the corrected scorer (run ${{ github.run_id }})"
          git push origin "cpu-rerun-results-${{ github.run_id }}"
