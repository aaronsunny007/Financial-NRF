name: cpu-rerun

# Re-runs the experiments with the corrected evidence-support scorer on free GitHub-hosted
# CPU runners, with no GPU and no paid API.
#
# The slow part is generation, so it is split across shards: each shard runs the experiment
# scripts over its own slice of the items (NRF_SHARD) and records every generation in a cache
# file (NRF_GEN_CACHE), pushing that file and its log tail to its own branch every few minutes
# (logs and artifacts cannot be read while a job runs, and the push doubles as a checkpoint).
# The replay job then merges the caches and runs the unchanged experiment scripts with
# --engine replay, which loads no model and fails on any prompt the shards did not cover.
# Outputs go to results/<tag>/ on a new branch, so recorded results are never overwritten.
#
# Models, items, the split and the decoding seed are inputs, so the same workflow produces the
# larger and multi-model runs described in the README.

on:
  workflow_dispatch:
    inputs:
      split:
        description: FinQA split (dev or test)
        default: 'dev'
      n_main:
        description: Items per experiment (Experiments 1, 3, 4, 5)
        default: '50'
      model:
        description: Generator (Hugging Face id)
        default: 'Qwen/Qwen2.5-3B-Instruct'
      temperature:
        description: Decoding temperature (0 is greedy, deterministic)
        default: '0'
      gen_seed:
        description: Sampling seed (used only when temperature > 0)
        default: '0'
      tag:
        description: Output directory name under results/
        default: 'cpu_fp32'
      shards:
        description: Number of parallel shards
        default: '20'
      dtype:
        description: CPU precision for the generator (float32 or bfloat16)
        default: 'float32'
      resume_from:
        description: Run id whose shard branches should seed the caches (to finish an interrupted run)
        default: ''
      replay_only:
        description: Skip generation and replay the committed results/<tag>/generations.jsonl
        default: 'false'
      cleanup:
        description: Delete the temporary cpu-gen-* and cpu-rerun-results-* branches and do nothing else
        default: 'false'

permissions:
  contents: write
  actions: read

jobs:
  cleanup:
    if: ${{ inputs.cleanup == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete temporary branches
        run: |
          for b in $(git ls-remote --heads origin 'cpu-gen-*' 'cpu-rerun-results-*' | awk '{print $2}'); do
            echo "deleting ${b#refs/heads/}"
            git push origin --delete "${b#refs/heads/}" || true
          done
          echo "remaining: $(git ls-remote --heads origin 'cpu-gen-*' 'cpu-rerun-results-*' | wc -l)"

  plan:
    if: ${{ inputs.replay_only != 'true' && inputs.cleanup != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 -c "import json,os; print('shards=' + json.dumps(list(range(int(os.environ['SHARDS'])))))" >> "$GITHUB_OUTPUT"

  generate:
    name: generate (shard ${{ matrix.shard }})
    if: ${{ inputs.replay_only != 'true' && inputs.cleanup != 'true' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      NRF_SHARD: ${{ matrix.shard }}/${{ inputs.shards }}
      NRF_GEN_CACHE: ${{ github.workspace }}/gen/shard_${{ matrix.shard }}.jsonl
      NRF_CPU_DTYPE: ${{ inputs.dtype }}
      NRF_LLM_MODEL: ${{ inputs.model }}
      NRF_TEMPERATURE: ${{ inputs.temperature }}
      NRF_GEN_SEED: ${{ inputs.gen_seed }}
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate sentence-transformers faiss-cpu numpy pandas

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ inputs.model }}-minilm-v1

      - name: Fetch FinQA data
        run: |
          curl -sSf -o data_loader/dev.json https://raw.githubusercontent.com/czyssrs/FinQA/main/dataset/dev.json
          curl -sSf -o data_loader/test.json https://raw.githubusercontent.com/czyssrs/FinQA/main/dataset/test.json

      - name: Resume from an earlier run's checkpoint
        if: ${{ inputs.resume_from != '' }}
        run: |
          mkdir -p gen
          git fetch -q origin "+refs/heads/cpu-gen-${{ inputs.resume_from }}-${{ matrix.shard }}:refs/remotes/resume/this" || true
          git show "refs/remotes/resume/this:gen/shard_${{ matrix.shard }}.jsonl" > "gen/shard_${{ matrix.shard }}.jsonl" || rm -f "gen/shard_${{ matrix.shard }}.jsonl"
          wc -l gen/*.jsonl || true

      - name: Generate (this shard's items)
        env:
          N_MAIN: ${{ inputs.n_main }}
          SPLIT: ${{ inputs.split }}
          SHARD: ${{ matrix.shard }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p gen scratch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          push_state() {
            tail -n 300 gen/log.txt > gen/log_tail.txt 2>/dev/null || true
            # one path at a time: git add aborts the whole command if any path is missing
            for f in gen/shard_${SHARD}.jsonl gen/log_tail.txt; do
              [ -e "$f" ] && git add -f "$f"
            done
            git commit -qm "shard ${SHARD} progress" 2>/dev/null || true
            git push -qf origin HEAD:refs/heads/cpu-gen-${RUN_ID}-${SHARD} 2>/dev/null || true
          }

          { echo "shard ${SHARD}"; nproc; free -g | head -2; lscpu | grep -E "Model name" ; } >> gen/log.txt 2>&1
          (
            # Experiments 1, 3 and 5's retrieval condition reuse Experiment 4's 0% level prompts,
            # so after Experiment 4 they are served from the cache and cost nothing.
            run() { echo "::group::$*"; echo "=== $(date -u +%T) START $*"; /usr/bin/time -v "$@" || true; echo "=== $(date -u +%T) END"; echo "::endgroup::"; }
            run python -m experiments.experiment4 --split "$SPLIT" --n "$N_MAIN" --injection-mode evidence --output scratch/e4.csv
            run python -m experiments.experiment5 --split "$SPLIT" --n "$N_MAIN" --output scratch/e5.csv
            run python -m experiments.experiment1 --split "$SPLIT" --n "$N_MAIN" --ness-mode derived --output scratch/e1.csv
            run python -m experiments.experiment3 --split "$SPLIT" --n "$N_MAIN" --output scratch/e3.csv
          ) >> gen/log.txt 2>&1 &
          pid=$!
          while kill -0 $pid 2>/dev/null; do sleep 150; push_state; done
          push_state
          wc -l gen/*.jsonl || true
          tail -n 20 gen/log.txt

  replay:
    needs: generate
    if: ${{ !cancelled() && inputs.cleanup != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      NRF_LLM_MODEL: ${{ inputs.model }}
      NRF_TEMPERATURE: ${{ inputs.temperature }}
      NRF_GEN_SEED: ${{ inputs.gen_seed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate sentence-transformers faiss-cpu numpy pandas

      - name: Fetch FinQA data
        run: |
          curl -sSf -o data_loader/dev.json https://raw.githubusercontent.com/czyssrs/FinQA/main/dataset/dev.json
          curl -sSf -o data_loader/test.json https://raw.githubusercontent.com/czyssrs/FinQA/main/dataset/test.json

      - name: Collect shard caches from their branches
        if: ${{ inputs.replay_only != 'true' }}
        env:
          RUN_ID: ${{ github.run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          git fetch -q origin "+refs/heads/cpu-gen-${RUN_ID}-*:refs/remotes/gen/*"
          mkdir -p caches "results/${TAG}"
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/gen); do
            k=${ref##*/}
            git show "$ref:gen/shard_${k}.jsonl" > "caches/shard_${k}.jsonl" || echo "no cache on $ref"
          done
          ls -la caches
          python - <<'PY'
          import glob, json, os
          seen, meta, n_in = {}, {}, 0
          for path in sorted(glob.glob("caches/*.jsonl")):
              for line in open(path, encoding="utf-8"):
                  line = line.strip()
                  if not line:
                      continue
                  rec = json.loads(line)
                  if "_meta" in rec:
                      meta.update(rec["_meta"])
                  else:
                      n_in += 1
                      seen[rec["key"]] = rec
          meta["generated_on"] = "GitHub-hosted ubuntu-latest CPU runners, " + os.environ.get("NRF_SHARDS_NOTE", "sharded")
          out = f"results/{os.environ['TAG']}/generations.jsonl"
          with open(out, "w", encoding="utf-8") as f:
              f.write(json.dumps({"_meta": meta}) + "\n")
              for rec in seen.values():
                  f.write(json.dumps(rec, ensure_ascii=False) + "\n")
          print(f"{n_in} entries in, {len(seen)} unique, meta={meta}")
          PY

      - name: Replay the experiments
        env:
          NRF_GEN_CACHE_READ: ${{ github.workspace }}/results/${{ inputs.tag }}/generations.jsonl
          N_MAIN: ${{ inputs.n_main }}
          SPLIT: ${{ inputs.split }}
          TAG: ${{ inputs.tag }}
        run: |
          O=results/$TAG
          mkdir -p $O
          step() {
            name=$1; shift
            echo "=== $name"
            if ! "$@" > $O/log_$name.txt 2>&1; then echo "FAILED: $name"; echo "FAILED" >> $O/log_$name.txt; tail -n 25 $O/log_$name.txt; fi
          }
          step experiment1 python -m experiments.experiment1 --engine replay --split "$SPLIT" --n "$N_MAIN" --ness-mode derived --output $O/experiment1_results_${SPLIT}.csv
          step experiment3 python -m experiments.experiment3 --engine replay --split "$SPLIT" --n "$N_MAIN" --output $O/experiment3_results_${SPLIT}.csv
          step experiment4 python -m experiments.experiment4 --engine replay --split "$SPLIT" --n "$N_MAIN" --injection-mode evidence --output $O/experiment4_results_${SPLIT}.csv
          step experiment5 python -m experiments.experiment5 --engine replay --split "$SPLIT" --n "$N_MAIN" --output $O/experiment5_results_${SPLIT}.csv
          ls -la $O

      - name: Score entailment (NLI) on the replayed responses
        continue-on-error: true
        env:
          TAG: ${{ inputs.tag }}
          SPLIT: ${{ inputs.split }}
        run: |
          if [ -f experiments/entailment_scoring.py ]; then
            python -m experiments.entailment_scoring --dir results/$TAG --split "$SPLIT" > results/$TAG/log_entailment_${SPLIT}.txt 2>&1 || { echo FAILED; tail -n 25 results/$TAG/log_entailment_${SPLIT}.txt; }
          fi

      - name: Commit results to a branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "cpu-rerun-results-${{ github.run_id }}"
          git add -f results/${{ inputs.tag }}
          git commit -m "CPU run ${{ inputs.tag }} / ${{ inputs.split }} / ${{ inputs.model }} (run ${{ github.run_id }})"
          git push origin "cpu-rerun-results-${{ github.run_id }}"
