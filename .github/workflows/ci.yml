name: checks

# Deliberately lightweight. The heavy dependencies (torch, faiss, bitsandbytes)
# need a GPU and several gigabytes, so CI does not install them. What it does
# verify is that every Python file parses, that the test suites (which need at
# most numpy) still pass, and that the weight sweep and the confidence-line audit reproduce their saved results.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile every Python file
        run: python -m compileall -q .

  gold-resolution:
    name: Gold-answer resolution tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the finqa_gold self-test
        # Runs only if the module exposes a __main__ test block; a module that
        # imports heavy dependencies is skipped rather than failing the build.
        run: |
          python - <<'PY'
          import subprocess, sys
          r = subprocess.run([sys.executable, "-m", "experiments.finqa_gold"],
                             capture_output=True, text=True)
          print(r.stdout)
          print(r.stderr, file=sys.stderr)
          if r.returncode != 0 and "ModuleNotFoundError" in r.stderr:
              print("Skipped: requires dependencies not installed in CI.")
              sys.exit(0)
          sys.exit(r.returncode)
          PY

  framework-tests:
    name: Framework tests and weight sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight dependencies
        run: pip install -r requirements-dev.txt

      - name: NRF parsing and evidence-support tests
        run: python -m framework.nrf

      - name: Arithmetic verifier tests
        run: python -m framework.verifier

      - name: Weight-sensitivity sweep reproduces committed results
        run: |
          python -m experiments.weight_sensitivity
          git diff --exit-code -- results/weight_sensitivity_dev.csv results/weight_sensitivity_dev_summary.json

      - name: Weight sweep on the CPU re-run reproduces committed results
        run: |
          python -m experiments.weight_sensitivity --results-dir results/cpu_fp32
          git diff --exit-code -- results/cpu_fp32/weight_sensitivity_dev.csv results/cpu_fp32/weight_sensitivity_dev_summary.json

      - name: Confidence-line audit reproduces committed results
        run: |
          python -m experiments.confidence_line_audit
          git diff --exit-code -- results/confidence_line_audit_dev.json
